<rect x="28" y="28" width="750" height="175" rx="18" fill="#0e2736" stroke="#164e63"/><text x="50" y="58" class="section" fill="#67e8f9">01 / ARRANQUE</text>
<rect x="50" y="84" width="245" height="90" rx="13" fill="#15394a" stroke="#22d3ee"/><text x="68" y="115" class="title">main()</text><text x="68" y="141" class="sub">runApp(MyApp())</text><text x="68" y="160" class="sub">lib/main.dart</text>
<rect x="410" y="84" width="340" height="90" rx="13" fill="#15394a" stroke="#22d3ee"/><text x="428" y="115" class="title">MyApp · MaterialApp</text><text x="428" y="141" class="sub">home + ThemeData</text><text x="428" y="160" class="sub">lib/main.dart</text>
