<rect x="410" y="302" width="340" height="106" rx="13" fill="#144339" stroke="#34d399"/><text x="428" y="335" class="title">Pantalla contador</text><text x="428" y="360" class="sub">CounterFunctionsScreen · StatefulWidget</text><text x="428" y="385" class="sub">Scaffold · AppBar · Text</text>
<path d="M580 174V302" class="edge"/><text x="594" y="226" class="label">home</text>
