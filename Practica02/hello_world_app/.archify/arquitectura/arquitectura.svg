<svg id="architecture" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="diagram-title diagram-description"><style>text{font-family:system-ui,sans-serif}.section{font-size:13px;letter-spacing:2px;font-weight:700}.title{font-size:19px;font-weight:650;fill:#f1f5f9}.sub{font-size:13px;fill:#bac9dc}.edge{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}.dep{stroke:#a78bfa;stroke-dasharray:6 5;marker-end:url(#purple)}.label{font-size:12px;fill:#cbd5e1;paint-order:stroke;stroke:#101c30;stroke-width:6;stroke-linejoin:round}</style><rect width="1200" height="850" fill="#101c30"/>
<title id="diagram-title">Arquitectura real de Counter Functions</title><desc id="diagram-description">main inicia MyApp y MaterialApp, que abre CounterFunctionsScreen. Los botones ejecutan callbacks con setState y modifican clickCounter; Flutter reconstruye la interfaz. Google Fonts configura Poppins. Existen destinos Android, iOS, web, Windows, macOS y Linux. No hay backend ni base de datos.</desc>
